  <script>
    (() => {
      const toggle = document.getElementById('language-toggle');
      const panels = document.querySelectorAll('[data-language-panel]');
      const savedLanguage = localStorage.getItem('homepage-language');
      let language = savedLanguage === 'en' ? 'en' : 'zh';

      const render = () => {
        document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
        panels.forEach((panel) => {
          panel.hidden = panel.dataset.languagePanel !== language;
        });
        toggle.textContent = language === 'en' ? '中' : 'EN';
        toggle.setAttribute('aria-label', language === 'en' ? '切换到中文' : 'Switch to English');
        document.getElementById('home-link').textContent = language === 'en' ? '← Back Home' : '← 返回 Home';
      };

      toggle.addEventListener('click', () => {
        language = language === 'en' ? 'zh' : 'en';
        localStorage.setItem('homepage-language', language);
        render();
      });

      render();
    })();
  </script>
